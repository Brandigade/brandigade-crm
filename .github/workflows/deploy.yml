# Every push to main: run the tests, update the Supabase database and edge
# functions, then publish the app to GitHub Pages. Pull requests only run tests.
#
# Repository secrets:  SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD,
#                      GMAIL_APP_PASSWORD (optional, with variable GMAIL_USER: turns on
#                      task reminder emails from that Gmail account)
#                      RESEND_API_KEY (optional, alternative email sender)
# Repository variables (all optional): SUPABASE_PROJECT_REF, SUPABASE_URL,
#   SUPABASE_ANON_KEY, APP_URL (defaults to the GitHub Pages address),
#   GMAIL_USER (the CRM's Gmail address for reminder emails),
#   REMINDER_FROM_EMAIL (Resend only; defaults to "Brandigade CRM <crm@brandigade.com>")
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: App tests
        run: npm test
      - name: Database and security tests
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: tests/sql/run.sh

  deploy-database:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'wqdysxpormmxxaakfgtu' }}
      APP_URL: ${{ vars.APP_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      GMAIL_USER: ${{ vars.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      REMINDER_FROM_EMAIL: ${{ vars.REMINDER_FROM_EMAIL || 'Brandigade CRM <crm@brandigade.com>' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Supabase settings
        id: cfg
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::warning::Supabase secrets or SUPABASE_PROJECT_REF are not set, so the database and functions were not deployed. See README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.ready == 'true'
        with:
          version: latest
      - name: Apply database migrations
        if: steps.cfg.outputs.ready == 'true'
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Deploy edge functions
        if: steps.cfg.outputs.ready == 'true'
        run: |
          supabase functions deploy team-admin --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy send-due-task-emails --project-ref "$SUPABASE_PROJECT_REF"
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          url="${APP_URL:-https://${owner}.github.io/${GITHUB_REPOSITORY#*/}/}"
          supabase secrets set APP_URL="$url" APP_NAME="Brandigade CRM" DUE_TASK_FROM_EMAIL="$REMINDER_FROM_EMAIL" --project-ref "$SUPABASE_PROJECT_REF"
          if [ -n "$RESEND_API_KEY" ]; then
            supabase secrets set RESEND_API_KEY="$RESEND_API_KEY" --project-ref "$SUPABASE_PROJECT_REF"
          fi
          if [ -n "$GMAIL_USER" ] && [ -n "$GMAIL_APP_PASSWORD" ]; then
            supabase secrets set GMAIL_USER="$GMAIL_USER" GMAIL_APP_PASSWORD="$GMAIL_APP_PASSWORD" --project-ref "$SUPABASE_PROJECT_REF"
          fi
          if [ -z "$RESEND_API_KEY" ] && { [ -z "$GMAIL_USER" ] || [ -z "$GMAIL_APP_PASSWORD" ]; }; then
            echo "::notice::No email sender is set (GMAIL_USER + GMAIL_APP_PASSWORD, or RESEND_API_KEY), so task reminder emails stay off."
          fi

  deploy-site:
    needs: deploy-database
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the site
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://wqdysxpormmxxaakfgtu.supabase.co' }}
          # Public anon key (safe to ship: it is in the published config.js anyway).
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndxZHlzeHBvcm1teHhhYWtmZ3R1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0ODMxNTcsImV4cCI6MjEwNzA1OTE1N30.OAqkIeHV60fHjcMxedzCDQkqzU1JLBUZxBN6YwpGf00' }}
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/
          node -e 'const c={supabaseUrl:process.env.SUPABASE_URL||"",supabaseAnonKey:process.env.SUPABASE_ANON_KEY||""};require("fs").writeFileSync("_site/config.js","window.BRANDIGADE_CONFIG = "+JSON.stringify(c,null,2)+";\n")'
          if [ -z "$SUPABASE_URL" ]; then echo "::warning::SUPABASE_URL is not set, so the published site opens in demo mode."; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
