# Run this after filling in or changing a setting (Settings -> Secrets and
# variables -> Actions): Actions -> Apply settings -> Run workflow.
#
# It copies the settings into the CRM's server on Supabase, connects Twilio
# when calling is filled in, and shows which features are on in the run's
# summary. It doesn't change the database, the server code or the site, so
# it's quick and safe to run any time. docs/SETTINGS.md lists every setting.
name: Apply settings

on:
  workflow_dispatch:

permissions:
  contents: read

# Never at the same time as a deploy.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SETTINGS_ONLY: "1"
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'wqdysxpormmxxaakfgtu' }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      APP_URL: ${{ vars.APP_URL }}
      # The same settings as deploy.yml.
      GMAIL_USER: ${{ vars.GMAIL_USER || secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      NOTIFICATION_FROM_EMAIL: ${{ vars.NOTIFICATION_FROM_EMAIL || vars.REMINDER_FROM_EMAIL }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
      MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
      MICROSOFT_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_API_KEY_SID: ${{ secrets.TWILIO_API_KEY_SID }}
      TWILIO_API_KEY_SECRET: ${{ secrets.TWILIO_API_KEY_SECRET }}
      TWILIO_CALLER_ID: ${{ secrets.TWILIO_CALLER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the Supabase secret
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::The SUPABASE_ACCESS_TOKEN secret is needed. See docs/SETTINGS.md."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - name: Apply the settings
        run: bash scripts/deploy-server.sh
