# Supabase CLI settings for the LOCAL development stack (`supabase start`).
# Production is the hosted project; nothing in this file is pushed to it.
# Ports use the 573xx range so this stack can run next to other local projects.
project_id = "brandigade-crm"

[api]
enabled = true
port = 57321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 57322
shadow_port = 57320
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = true

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = false
port = 57323

# Local auth emails (invites, password resets) are caught here: http://127.0.0.1:57324
# The app's own notification emails can be sent to the same catcher in local
# development with SMTP_HOST=127.0.0.1 SMTP_PORT=57325 (see .env.local).
[local_smtp]
enabled = true
port = 57324
smtp_port = 57325

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.s3_protocol]
enabled = false

[storage.analytics]
enabled = false

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[edge_runtime]
enabled = true

# The CRM's server (supabase/functions/api). Each route checks who is calling
# itself, because webhooks and the scheduler have no Supabase sign-in.
[functions.api]
verify_jwt = false

[analytics]
enabled = false
